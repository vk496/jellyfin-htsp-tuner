name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Least-privilege by default; the release job opts into `contents: write` explicitly.
permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The muxer acceptance tests verify the emitted MPEG-TS with ffprobe, so it must be present.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors + GenerateDocumentationFile are ON in the csproj, so this
      # fails on any missing XML doc comment or any warning -- that is intentional.
      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      # Only run tests if a test project actually exists yet (it may land later).
      - name: Test
        shell: bash
        run: |
          if git ls-files '*Tests*.csproj' '*.Tests.csproj' | grep -q .; then
            dotnet test --configuration Release --no-build --verbosity normal
          else
            echo "No test project found -- skipping test step."
          fi

  # One build has to load on every server from targetAbi up. Jellyfin breaks its API within a minor
  # line (10.11.x replaced IUserManager.Users with GetUsers()), so JIT the shipped assembly against
  # the oldest and newest server of each build's range to catch a missing member before users do.
  # `build` is the plugin's target: net8.0 ships to 10.10, net9.0 to 10.11 and up.
  abi:
    name: Loads on Jellyfin ${{ matrix.jellyfin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { jellyfin: "10.10.0", build: net8.0, tf: net8.0, hosting: "8.0.1" }
          - { jellyfin: "10.10.*", build: net8.0, tf: net8.0, hosting: "8.0.1" }
          - { jellyfin: "10.11.0", build: net9.0, tf: net9.0, hosting: "9.0.11" }
          - { jellyfin: "10.11.*", build: net9.0, tf: net9.0, hosting: "9.0.11" }
          - { jellyfin: "12.0.0", build: net9.0, tf: net10.0, hosting: "10.0.0" }
          - { jellyfin: "12.*", build: net9.0, tf: net10.0, hosting: "10.0.0" }
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build plugin
        run: dotnet build HtspTuner/HtspTuner.csproj --configuration Release

      - name: JIT every method against Jellyfin ${{ matrix.jellyfin }}
        run: >-
          dotnet run --project tools/abi-check --configuration Release
          -p:TF=${{ matrix.tf }} -p:JF="${{ matrix.jellyfin }}" -p:HA=${{ matrix.hosting }}
          -p:PluginDll="$PWD/HtspTuner/bin/Release/${{ matrix.build }}/HtspTuner.dll"

  release:
    name: Package & Release
    needs: [build, abi]
    # Only build a release artifact for version tags (e.g. v1.0.0.0).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history so the manifest commit can be pushed back to the default branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # jprm reads build.yaml, builds the csproj in Release, and emits a versioned zip
      # containing the dll + a generated meta.json.
      - name: Install jprm
        run: python -m pip install --upgrade jprm

      # The plugin version comes from the tag (v1.2.3.4 -> 1.2.3.4), so a release is cut
      # just by pushing a tag; no file needs editing.
      - name: Package with jprm
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          zip_path="$(jprm --verbosity=debug plugin build . --version="${version}" --output=./artifacts)"
          echo "Built: ${zip_path}"

          # The Jellyfin 10.10 build: net8.0, its own targetAbi, and a version below every 10.11 one
          # (A.B.C.D -> 0.A.B.(C*1000+D), so 1.1.0.0 -> 0.1.1.0). A server installs the highest version
          # whose targetAbi it meets, so 10.11+ servers keep getting the net9.0 build and only 10.10
          # servers get this one.
          # ponytail: unique only while D < 1000; widen the multiplier if a revision ever gets there.
          # Built from a copy of the plugin project alone: jprm retargets every project it finds, and
          # the tests are net9.0-only. The copy also leaves build.yaml untouched for the manifest commit.
          IFS=. read -r a b c d <<< "${version}"
          legacy_version="0.${a}.${b}.$((c * 1000 + d))"
          legacy="$RUNNER_TEMP/legacy"
          cp -r HtspTuner "$legacy"
          sed -e 's/^targetAbi: .*/targetAbi: "10.10.0.0"/' -e 's/^framework: .*/framework: "net8.0"/' build.yaml > "$legacy/build.yaml"
          zip_path="$(jprm --verbosity=debug plugin build "$legacy" --version="${legacy_version}" --output=./artifacts)"
          # Named after the release rather than its own version, so the release page reads
          # htsp-tuner_1.1.0.0_jellyfin-10.10.zip next to htsp-tuner_1.1.0.0.zip. Jellyfin only reads
          # the version inside the zip.
          mv "${zip_path}" "artifacts/htsp-tuner_${version}_jellyfin-10.10.zip"
          echo "Built: artifacts/htsp-tuner_${version}_jellyfin-10.10.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Publish this version into manifest.json on main so Jellyfin clients that added the
      # repository URL see the update. The zips are served from the GitHub Release assets above.
      - name: Update repository manifest
        shell: bash
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          [ -f manifest.json ] || jprm repo init .
          for zip in artifacts/*.zip; do
            dl_url="${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(basename "${zip}")"
            jprm repo add --plugin-url "${dl_url}" . "${zip}"
          done
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json unchanged"
            exit 0
          fi
          git commit -m "Publish ${GITHUB_REF_NAME} to the plugin repository manifest [skip ci]"
          git push origin HEAD:main
